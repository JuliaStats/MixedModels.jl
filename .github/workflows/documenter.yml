name: Documenter
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    tags: [v*]
    paths-ignore:
      - 'LICENSE.md'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'LICENSE.md'
      - 'README.md'
jobs:
  Documenter:
    name: Documentation
    runs-on: ubuntu-26.04
    # GitHub-hosted runners vary in CPU microarchitecture, and a pkgimage cache built
    # natively on one runner can be rejected on another, forcing recompilation.
    # Pinning a portable target keeps the cache reusable across runners.
    # This is only done for the docs: the test jobs deliberately compile natively
    # so that we exercise the most recent SIMD features in the numerics.
    # See https://discourse.julialang.org/t/138390
    env:
      JULIA_CPU_TARGET: "x86-64-v3"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
            cache-compiled: "true"
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-docdeploy@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
